name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Unit tests run against PGlite in memory — no service container, no
      # DATABASE_URL, and the same migrations and RLS policies a deployment gets.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-only-secret-not-used-to-sign-anything-real

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Only Chromium; the suite is about whether the demo path works, not about
      # cross-browser rendering.
      - name: Install browser
        run: npx playwright install --with-deps chromium

      # Seeds a fresh database, builds, starts, and drives the walkthrough a
      # reviewer is shown — including that the unsupported claim still reads as
      # unsupported and that the other tenant still gets a 404.
      - name: Run end-to-end suite
        run: npm run test:e2e
        env:
          AUTH_SECRET: ci-only-secret-not-used-to-sign-anything-real

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
