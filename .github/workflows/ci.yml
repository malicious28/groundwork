name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Tests run against PGlite in memory — no service container, no
      # DATABASE_URL, and the same migrations and RLS policies a deployment gets.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-only-secret-not-used-to-sign-anything-real
